# 总后台(控制面)配置 —— 本地文件 + env, 不依赖 Nacos 启动(控制面是配置写方)。
server:
  address:     ":8003"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"

logger:
  level:  "all"
  stdout: true

# 控制面独立库 my_manage
database:
  default:
    link:  "pgsql:postgres:654321@tcp(127.0.0.1:5432)/my_manage?sslmode=disable"
    debug: true

redis:
  default:
    address: "127.0.0.1:6379"
    db:      1   # 与站点服务(db 0)隔离

# Nacos 配置发布(M3, 控制面=唯一写方)。namespaceId 在 Nacos 控制台「命名空间」页查看。
nacospub:
  addr:  "127.0.0.1:8848"
  user:  "nacos"
  pass:  "nacos"
  group: "DEFAULT_GROUP"
  namespaces:
    dev:  "dev"    # 命名空间ID(你建的是自定义ID, 正好与名称一致)
    test: "test"
    prod: ""

# 开站清单(M4)
provision:
  gooseVersion: 0   # 站点库期望迁移版本; 0=只要求已跑过迁移。my_service 发新迁移后手动更新(当前最新为 10)。
